name: Node.js CI

on: [push]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun lint

  publish:
    needs: [build, test, lint]
    runs-on: ubuntu-latest

    # Run on any tag
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs a newer npm than the one Node ships with.
      - run: npm install -g npm@latest

      - run: bun install

      - run: bun run build

      # A pushed v-tag is an explicit release signal, so publish unconditionally — except when
      # that version is already on the registry, which a re-run of a green release otherwise
      # turns into a red one.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@elumixor/synced@$version" version > /dev/null 2>&1; then
            echo "@elumixor/synced@$version is already published."
            exit 0
          fi
          npm publish --access public
